name: Build Windows Wrapper

on:
  push:
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build wrapper.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show compiler version
        shell: pwsh
        run: |
          cl

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path ".\wrapper.exe")) {
              Write-Error "wrapper.exe was not created"
              exit 1
          }

          $file = Get-Item ".\wrapper.exe"

          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

          Get-FileHash ".\wrapper.exe" -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb-fastboot-wrapper-windows-x64
          path: wrapper.exe
          if-no-files-found: error
          retention-days: 30


name: Build and Test Windows Wrapper

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test wrapper.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show compiler version
        shell: pwsh
        run: cl

      - name: Build wrapper
        shell: pwsh
        run: .\build.ps1

      - name: Download official adb/fastboot
        shell: pwsh
        run: |
          # Скачиваем platform-tools
          $url = "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          $zip = "$env:TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\platform-tools"
          # Копируем adb.exe и fastboot.exe в рабочую папку как adb.real.exe и fastboot.real.exe
          Copy-Item "$env:TEMP\platform-tools\platform-tools\adb.exe" -Destination ".\adb.real.exe"
          Copy-Item "$env:TEMP\platform-tools\platform-tools\fastboot.exe" -Destination ".\fastboot.real.exe"

      - name: Prepare wrapper as adb.exe and fastboot.exe
        shell: pwsh
        run: |
          Copy-Item ".\wrapper.exe" -Destination ".\adb.exe"
          Copy-Item ".\wrapper.exe" -Destination ".\fastboot.exe"

      - name: Run tests
        shell: pwsh
        run: |
          .\test.ps1

      - name: Upload build artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: adb-fastboot-wrapper-windows-x64
          path: wrapper.exe
          if-no-files-found: error
          retention-days: 30